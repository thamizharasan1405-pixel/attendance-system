<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AeroAttend Main Shell Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="public/js/common.js"></script>
  <script>
    renderShell({ role: "admin", page: "Dashboard", subtitle: "Workspace" });
    document.getElementById("page-content").innerHTML = `
      <div style="padding:24px;border:1px dashed var(--border);border-radius:14px;background:var(--surface)">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)">Step 2</div>
        <h2 style="margin:7px 0">Main Shell is ready</h2>
        <p style="color:var(--muted);font-size:12px;margin:0">Replace the page content here with each existing project page. Sidebar, header, theme and responsive navigation are handled by common.js.</p>
      </div>`;
  </script>
</body>
</html>
