<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports & Analytics</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="/js/common.js"></script>
  <script>
    const session = requireAnyRole(['admin', 'staff']);
    if (session) {
      renderShell({ role: session.role, activeHref: '/reports.html', title: 'Reports & Analytics', welcomeName: session.role === 'admin' ? 'Admin' : session.data.name });
    }

    let barChart, pieChart;

    async function init() {
      if (!session) return;
      const students = await apiGet('/students');
      let depts = [...new Set(students.map(s => s.department))];
      const isStaff = session.role === 'staff';
      const isHOD = isStaff && session.data.role === 'HOD';
      if (isStaff && !isHOD) {
        const myDepts = new Set((session.data.assignments || []).map(a => a.department));
        depts = depts.filter(d => myDepts.has(d));
      }
      document.getElementById('page-content').innerHTML = `
        <div class="card">
          <div class="toolbar">
            <div class="form-row" style="flex:1;grid-template-columns:1fr 1fr 1fr 1fr;">
              <div class="field"><label>Department</label>
                <select id="dept" onchange="loadReport()">
                  ${!isStaff || isHOD ? '<option value="">All Departments</option>' : ''}
                  ${depts.map(d => `<option value="${d}">${d}</option>`).join('')}
                </select>
              </div>
              <div class="field"><label>Year</label>
                <select id="repYear" onchange="loadReport()">
                  <option value="">All Years</option>
                  ${ALL_YEARS.map(y => `<option value="${y}">Year ${y}</option>`).join('')}
                </select>
              </div>
              <div class="field"><label>Export Range</label>
                <select id="range" onchange="toggleRangeInput()">
                  <option value="monthly">Monthly</option>
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly (last 7 days)</option>
                </select>
              </div>
              <div class="field" id="range-input-field"><label>Select Month</label><input type="month" id="month" value="${new Date().toISOString().slice(0,7)}"></div>
            </div>
            <button class="btn btn-outline" onclick="exportCsv()" style="white-space:nowrap;height:fit-content;">⬇ Export CSV</button>
          </div>
        </div>
        <div class="card">
          <p style="font-size:12px;color:#94a3b8;margin:0;">Export pulls attendance across all selected departments &amp; years — daily, weekly, or monthly — as a downloadable CSV document.</p>
        </div>
      `;
      document.getElementById('page-content').innerHTML += `
        <div class="grid-2">
          <div class="card">
            <h3>Attendance Statistics</h3>
            <canvas id="barChart" height="160"></canvas>
          </div>
          <div class="card">
            <h3>Department Wise</h3>
            <canvas id="pieChart" height="160"></canvas>
          </div>
        </div>
      `;
      loadReport();
    }

    function toggleRangeInput() {
      const range = document.getElementById('range').value;
      const field = document.getElementById('range-input-field');
      if (range === 'monthly') {
        field.innerHTML = `<label>Select Month</label><input type="month" id="month" value="${new Date().toISOString().slice(0,7)}">`;
      } else {
        field.innerHTML = `<label>Select Date</label><input type="date" id="rangeDate" value="${new Date().toISOString().slice(0,10)}">`;
      }
    }

    function exportCsv() {
      const dept = document.getElementById('dept').value;
      const year = document.getElementById('repYear').value;
      const range = document.getElementById('range').value;
      const params = new URLSearchParams();
      if (dept) params.set('department', dept);
      if (year) params.set('year', year);
      if (range === 'monthly') {
        const month = document.getElementById('month').value;
        if (month) params.set('month', month);
      } else {
        params.set('range', range);
        const dateEl = document.getElementById('rangeDate');
        if (dateEl && dateEl.value) params.set('date', dateEl.value);
      }
      window.location.href = '/api/reports/export?' + params.toString();
    }

    async function loadReport() {
      const dept = document.getElementById('dept').value;
      const summary = await apiGet('/reports/summary' + (dept ? '?department=' + dept : ''));
      const labels = Object.keys(summary.weekly).sort();
      const present = labels.map(d => summary.weekly[d].present);
      const absent = labels.map(d => summary.weekly[d].absent);

      if (barChart) barChart.destroy();
      barChart = new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: { labels, datasets: [
          { label: 'Present', data: present, backgroundColor: '#2563eb' },
          { label: 'Absent', data: absent, backgroundColor: '#f9a8d4' }
        ]},
        options: { plugins: { legend: { position: 'bottom' } } }
      });

      if (pieChart) pieChart.destroy();
      pieChart = new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: {
          labels: summary.deptWise.map(d => d.department),
          datasets: [{ data: summary.deptWise.map(d => d.percent), backgroundColor: ['#2563eb', '#16a34a', '#f59e0b', '#8b5cf6', '#ec4899'] }]
        },
        options: { plugins: { legend: { position: 'right' } } }
      });
    }

    if (session) init();
  </script>
</body>
</html>
