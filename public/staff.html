<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Management</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="/js/common.js"></script>
  <script>
    const session = requireRole('admin');
    if (session) {
      renderShell({ role: 'admin', activeHref: '/staff.html', title: 'Staff Management', welcomeName: 'Admin' });
      load();
    }

    let editingId = null;
    const ROLES = ['Subject Lecturer', 'Class Teacher', 'HOD'];

    async function load() {
      const staff = await apiGet('/staff');
      document.getElementById('page-content').innerHTML = `
        <div class="card">
          <div class="toolbar">
            <div class="search-box"><input id="search" placeholder="Search staff..." oninput="filterRows()"></div>
            <button class="btn btn-primary" onclick="openForm()">+ Add Staff</button>
          </div>
          <table>
            <thead><tr><th>#</th><th>Name</th><th>Staff ID</th><th>Subject</th><th>Role</th><th>Assigned To</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="form-card"></div>
      `;
      window._staff = staff;
      renderRows(staff);
    }

    function assignedLabel(s) {
      if (s.role === 'HOD') return 'All departments · All years';
      const list = s.assignments || [];
      if (!list.length) return '—';
      return list.map(a => `${a.department}-Y${a.year}`).join(', ');
    }

    function renderRows(list) {
      document.getElementById('rows').innerHTML = list.map((s, i) => `
        <tr>
          <td>${i + 1}</td><td>${titleCase(s.name)}</td><td>${s.staffId}</td><td>${s.subject || '-'}</td><td>${s.role}</td>
          <td style="font-size:12px;color:#64748b;">${assignedLabel(s)}</td>
          <td><span class="badge ${(s.status || 'Active').toLowerCase()}">${s.status || 'Active'}</span></td>
          <td>
            <button class="icon-btn" onclick="openForm(${s.id})">✏️</button>
            <button class="icon-btn danger" onclick="removeStaff(${s.id})">🗑️</button>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:20px;">No staff found</td></tr>';
    }

    function filterRows() {
      const q = document.getElementById('search').value.toLowerCase();
      renderRows(window._staff.filter(s => s.name.toLowerCase().includes(q) || s.staffId.toLowerCase().includes(q)));
    }

    function openForm(id) {
      editingId = id || null;
      const s = id ? window._staff.find(x => x.id === id)
        : { name: '', staffId: '', username: '', password: '', subject: '', role: 'Subject Lecturer', assignments: [], phone: '', email: '', status: 'Active' };
      const assignSet = new Set((s.assignments || []).map(a => `${a.department}|${a.year}`));

      document.getElementById('form-card').innerHTML = `
        <div class="card">
          <h3>${id ? 'Edit Staff' : 'Add Staff'}</h3>
          <div class="form-row">
            <div class="field"><label>Name</label><input id="f-name" value="${s.name}"></div>
            <div class="field"><label>Staff ID</label><input id="f-staffId" value="${s.staffId}"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>Login Username</label><input id="f-username" value="${s.username || ''}" placeholder="e.g. kumar.bca"></div>
            <div class="field"><label>Login Password</label><input id="f-password" value="${s.password || ''}" placeholder="Set a password"></div>
          </div>
          <div style="font-size:11.5px;color:#94a3b8;margin:-8px 0 16px;">This staff will log in with this exact username &amp; password.</div>

          <div class="form-row">
            <div class="field"><label>Subject Taught</label><input id="f-subject" value="${s.subject || ''}" placeholder="e.g. Tamil, Python Programming"></div>
            <div class="field"><label>Role</label>
              <select id="f-role" onchange="toggleAssignGrid()">${ROLES.map(r => `<option value="${r}" ${s.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select>
            </div>
          </div>

          <div class="field" id="assign-field" style="display:${s.role === 'HOD' ? 'none' : ''};">
            <label id="assign-label">${s.role === 'Class Teacher' ? 'Class Teacher for (pick exactly one)' : 'Teaches this subject in (pick all that apply)'}</label>
            <div id="assign-grid" style="display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#f8fafc;border-radius:10px;">
              ${ALL_DEPARTMENTS.map(d => ALL_YEARS.map(y => {
                const key = `${d}|${y}`;
                const checked = assignSet.has(key);
                const inputType = s.role === 'Class Teacher' ? 'radio' : 'checkbox';
                const inputName = s.role === 'Class Teacher' ? 'assign-radio' : '';
                return `<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;background:#fff;border:1px solid #e2e8f0;padding:6px 10px;border-radius:8px;cursor:pointer;">
                  <input type="${inputType}" name="${inputName}" class="assign-chk" value="${key}" ${checked ? 'checked' : ''}> ${d} · Year ${y}
                </label>`;
              }).join('')).join('')}
            </div>
            <div style="font-size:11.5px;color:#94a3b8;margin-top:6px;">e.g. a Tamil teacher can be assigned CS Year 2, CS Year 3, IT Year 2, IT Year 3 all at once.</div>
          </div>
          <div id="hod-note" style="display:${s.role === 'HOD' ? '' : 'none'};font-size:12px;color:#94a3b8;margin-bottom:16px;">HOD automatically gets access to all departments and all years — no need to pick.</div>

          <div class="form-row">
            <div class="field"><label>Phone</label><input id="f-phone" value="${s.phone || ''}"></div>
            <div class="field"><label>Email</label><input id="f-email" value="${s.email || ''}"></div>
          </div>
          <div style="display:flex;gap:10px;">
            <button class="btn btn-primary" onclick="saveStaff()">Save</button>
            <button class="btn btn-outline" onclick="document.getElementById('form-card').innerHTML=''">Cancel</button>
          </div>
        </div>
      `;
    }

    function toggleAssignGrid() {
      const role = document.getElementById('f-role').value;
      document.getElementById('assign-field').style.display = role === 'HOD' ? 'none' : '';
      document.getElementById('hod-note').style.display = role === 'HOD' ? '' : 'none';
      document.getElementById('assign-label').textContent = role === 'Class Teacher' ? 'Class Teacher for (pick exactly one)' : 'Teaches this subject in (pick all that apply)';
      document.querySelectorAll('.assign-chk').forEach(el => {
        el.type = role === 'Class Teacher' ? 'radio' : 'checkbox';
        el.name = role === 'Class Teacher' ? 'assign-radio' : '';
      });
    }

    async function saveStaff() {
      const role = document.getElementById('f-role').value;
      let assignments = [];
      if (role !== 'HOD') {
        document.querySelectorAll('.assign-chk:checked').forEach(el => {
          const [department, year] = el.value.split('|');
          assignments.push({ department, year });
        });
      }
      const body = {
        name: titleCase(document.getElementById('f-name').value.trim()),
        staffId: document.getElementById('f-staffId').value,
        username: document.getElementById('f-username').value.trim(),
        password: document.getElementById('f-password').value,
        subject: document.getElementById('f-subject').value,
        role: role,
        assignments: assignments,
        department: assignments[0] ? assignments[0].department : '', // kept for backward-compat display
        phone: document.getElementById('f-phone').value,
        email: document.getElementById('f-email').value
      };
      if (editingId) await apiPut('/staff/' + editingId, body);
      else await apiPost('/staff', body);
      document.getElementById('form-card').innerHTML = '';
      load();
    }

    async function removeStaff(id) {
      if (!confirm('Delete this staff member?')) return;
      await apiDelete('/staff/' + id);
      load();
    }
  </script>
</body>
</html>
