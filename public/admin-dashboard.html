<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="/js/common.js"></script>
  <script>
    const session = requireRole('admin');
    if (session) {
      renderShell({ role: 'admin', activeHref: '/admin-dashboard.html', title: 'Dashboard', welcomeName: 'Admin' });
      load();
    }

    async function load() {
      const data = await apiGet('/dashboard/admin');
      const summary = await apiGet('/reports/summary');

      document.getElementById('page-content').innerHTML = `
        <div class="stats-row">
          <div class="stat-card blue"><div class="label">Total Students</div><div class="value">${data.totalStudents}</div></div>
          <div class="stat-card green"><div class="label">Total Staff</div><div class="value">${data.totalStaff}</div></div>
          <div class="stat-card green"><div class="label">Present Today</div><div class="value">${data.presentToday}</div></div>
          <div class="stat-card red"><div class="label">Absent Today</div><div class="value">${data.absentToday}</div></div>
        </div>
        <div class="grid-2">
          <div class="card">
            <h3>Attendance Overview — This Week</h3>
            <div id="rollcallChart"></div>
          </div>
          <div class="card">
            <h3>Recent Activities</h3>
            <div id="activities"></div>
          </div>
        </div>
        <div class="grid-2" style="margin-top:20px;">
          <div class="card">
            <h3>👥 Staff Overview</h3>
            <table>
              <thead><tr><th>Name</th><th>Department</th><th>Role</th><th>Status</th></tr></thead>
              <tbody>
                ${data.staffOverview.map(s => `
                  <tr>
                    <td>${titleCase(s.name)}</td><td>${s.department}</td><td>${s.role}</td>
                    <td><span class="badge ${(s.status || 'Active').toLowerCase()}">${s.status || 'Active'}</span></td>
                  </tr>
                `).join('') || `<tr><td colspan="4" style="text-align:center;color:#94a3b8;">No staff yet</td></tr>`}
              </tbody>
            </table>
          </div>
          <div class="card">
            <h3>🎓 Recent Student Activity</h3>
            <div id="student-activity"></div>
          </div>
        </div>
      `;

      document.getElementById('student-activity').innerHTML = data.recentStudentActivity.map(a => `
        <div style="padding:10px 0;border-bottom:1px solid #f4f4fa;display:flex;justify-content:space-between;font-size:13px;">
          <span>${titleCase(a.name)} — <span class="badge ${a.status.toLowerCase()}" style="padding:2px 8px;font-size:10.5px;">${a.status}</span></span>
          <span style="color:#94a3b8;font-size:11.5px;">${a.date}${a.period ? ' · P' + a.period : ''}</span>
        </div>
      `).join('') || `<p style="text-align:center;color:#94a3b8;padding:16px;">No recent activity</p>`;

      document.getElementById('activities').innerHTML = data.recentActivities.map(a =>
        `<div style="padding:10px 0;border-bottom:1px solid #f4f4fa;display:flex;justify-content:space-between;font-size:13px;">
          <span>🔔 ${a.message}</span><span style="color:#94a3b8;font-size:11.5px;">${a.time}</span>
        </div>`
      ).join('') || `<p style="text-align:center;color:#94a3b8;padding:16px;">No recent activity</p>`;

      const labels = Object.keys(summary.weekly).sort();
      const present = labels.map(d => summary.weekly[d].present);
      const absent = labels.map(d => summary.weekly[d].absent);
      const chartEl = document.getElementById('rollcallChart');

      if (!labels.length) {
        chartEl.innerHTML = `<div class="rollcall-empty">📋 No attendance marked yet this week</div>`;
      } else {
        const maxVal = Math.max(1, ...labels.map((d, i) => Math.max(present[i], absent[i])));
        const dayName = d => new Date(d).toLocaleDateString('en-IN', { weekday: 'short' });
        const dayNum = d => new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
        chartEl.innerHTML = `
          <div class="rollcall-chart">
            ${labels.map((d, i) => `
              <div class="rollcall-col">
                <div class="rollcall-bars">
                  <div class="rollcall-bar present" style="height:${Math.round((present[i] / maxVal) * 140) || 3}px;">
                    ${present[i] ? `<span class="count">${present[i]}</span>` : ''}
                  </div>
                  <div class="rollcall-bar absent" style="height:${Math.round((absent[i] / maxVal) * 140) || 3}px;">
                    ${absent[i] ? `<span class="count">${absent[i]}</span>` : ''}
                  </div>
                </div>
                <div class="day-label">${dayName(d)}</div>
                <div class="day-date">${dayNum(d)}</div>
              </div>
            `).join('')}
          </div>
          <div class="rollcall-legend">
            <span><i class="dot present"></i>Present</span>
            <span><i class="dot absent"></i>Absent</span>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
