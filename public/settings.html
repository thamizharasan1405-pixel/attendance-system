<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile & Settings</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="/js/common.js"></script>
  <script>
    const session = getSession();
    if (!session) window.location.href = '/login.html';
    const name = session.role === 'admin' ? 'Admin' : session.data.name;
    renderShell({ role: session.role, activeHref: '/settings.html', title: 'Profile & Settings', welcomeName: name });

    const profile = session.role === 'admin'
      ? { name: 'Admin', email: 'admin@college.com', phone: '9876543210' }
      : session.data;

    document.getElementById('page-content').innerHTML = `
      <div class="grid-2">
        <div class="card" style="text-align:center;">
          <h3 style="text-align:left;">Profile Picture</h3>
          <div class="avatar-lg" style="width:100px;height:100px;font-size:36px;margin:20px auto;">${name.charAt(0)}</div>
          <button class="btn btn-primary">Change Photo</button>
        </div>
        <div class="card">
          <h3>Account Settings</h3>
          <div class="field"><label>Full Name</label><input value="${profile.name || ''}"></div>
          <div class="field"><label>Email</label><input value="${profile.email || ''}"></div>
          <div class="field"><label>Phone</label><input value="${profile.phone || ''}"></div>
          <div class="field"><label>Current Password</label>
            <div style="position:relative;">
              <input id="cur-pwd" type="password" placeholder="••••••••" style="padding-right:40px;">
              <button type="button" onclick="toggleSettingsPwd('cur-pwd', this)" style="position:absolute;right:2px;top:2px;bottom:2px;width:38px;background:none;border:none;font-size:16px;color:#64748b;">👁️</button>
            </div>
          </div>
          <div class="field"><label>New Password</label>
            <div style="position:relative;">
              <input id="new-pwd" type="password" placeholder="••••••••" style="padding-right:40px;">
              <button type="button" onclick="toggleSettingsPwd('new-pwd', this)" style="position:absolute;right:2px;top:2px;bottom:2px;width:38px;background:none;border:none;font-size:16px;color:#64748b;">👁️</button>
            </div>
          </div>
          <button class="btn btn-primary" onclick="alert('Settings saved!')">Save Changes</button>
        </div>
      </div>
    `;

    function toggleSettingsPwd(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
      else { input.type = 'password'; btn.textContent = '👁️'; }
    }
  </script>
</body>
</html>
