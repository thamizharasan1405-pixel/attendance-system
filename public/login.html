<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Cloud Attendance System</title>
<link rel="stylesheet" href="/css/common.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="logo">🎓</div>
      <h2>Welcome Back!</h2>
      <p class="sub">Login to manage the system</p>

      <div class="field">
        <label>Role</label>
        <select id="role">
          <option value="admin">Admin</option>
          <option value="staff">Staff</option>
          <option value="student">Student</option>
          <option value="parent">Parent</option>
        </select>
      </div>
      <div class="field">
        <label id="uname-label">Username</label>
        <input id="username" placeholder="admin" value="admin">
      </div>
      <div class="field">
        <label>Password</label>
        <div style="position:relative;">
          <input id="password" type="password" placeholder="••••••" value="admin123" style="padding-right:40px;">
          <button type="button" onclick="togglePassword()" style="position:absolute;right:2px;top:2px;bottom:2px;width:38px;background:none;border:none;font-size:16px;color:#64748b;">👁️</button>
        </div>
      </div>
      <div class="field" id="staff-select-field" style="display:none;">
        <label>Select Your Name</label>
        <select id="staff-select"></select>
      </div>
      <button class="btn btn-primary btn-block" onclick="doLogin()" id="login-btn">Login</button>
      <div class="error-msg" id="err"></div>
      <p class="auth-hint">Try: admin/admin123 (Admin), staff/staff123 (Staff), Reg No 22BCA001 (student, any password), 22BCA001 (parent, any password).</p>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const btn = event.target;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    document.getElementById('role').addEventListener('change', (e) => {
      const label = document.getElementById('uname-label');
      const input = document.getElementById('username');
      const pwd = document.getElementById('password');
      document.getElementById('staff-select-field').style.display = 'none';
      const map = {
        admin: ['Username', 'admin', 'admin123'],
        staff: ['Username', 'staff', 'staff123'],
        student: ['Register Number', '22BCA001', ''],
        parent: ['Student Reg No', '22BCA001', '']
      };
      const [lbl, ph, pwPh] = map[e.target.value];
      label.textContent = lbl;
      input.placeholder = ph;
      input.value = ph;
      pwd.value = pwPh;
    });

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const err = document.getElementById('err');
      err.textContent = '';
      try {
        const result = await apiPost('/login', { username, password });
        if (!result.success) {
          err.textContent = result.message || 'Invalid credentials';
          return;
        }
        if (result.needsSelection) {
          // Common staff login succeeded - now let them pick who they are
          const sel = document.getElementById('staff-select');
          sel.innerHTML = result.staffList.map(s => `<option value="${s.staffId}">${s.name} (${s.department})</option>`).join('');
          document.getElementById('staff-select-field').style.display = 'block';
          document.getElementById('login-btn').textContent = 'Continue';
          document.getElementById('login-btn').onclick = finishStaffLogin;
          return;
        }
        finishLogin(result);
      } catch (e) {
        err.textContent = 'Server error. Is the server running?';
      }
    }

    async function finishStaffLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const staffId = document.getElementById('staff-select').value;
      const result = await apiPost('/login', { username, password, staffId });
      if (!result.success) {
        document.getElementById('err').textContent = result.message || 'Invalid selection';
        return;
      }
      finishLogin(result);
    }

    function finishLogin(result) {
      sessionStorage.setItem('session', JSON.stringify(result));
      if (result.role === 'admin') window.location.href = '/admin-dashboard.html';
      else if (result.role === 'staff') window.location.href = '/staff-dashboard.html';
      else if (result.role === 'student') window.location.href = '/student-dashboard.html';
      else if (result.role === 'parent') window.location.href = '/parent-dashboard.html';
    }
  </script>
</body>
</html>
