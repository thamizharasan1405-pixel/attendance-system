<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login - Cloud Attendance System</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .auth-bg {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(1.5px 1.5px at center, rgba(255,255,255,0.08) 1.5px, transparent 1.5px) 0 0/26px 26px,
      linear-gradient(150deg, #0E1712 0%, #172420 55%, #1F6E43 130%);
    padding: 24px; position: relative; overflow: hidden;
  }
  .auth-bg::before {
    content: ''; position: absolute; width: 500px; height: 500px; border-radius: 50%;
    background: rgba(255,255,255,0.06); top: -180px; right: -180px;
  }
  .glass-card {
    position: relative; z-index: 2;
    background: rgba(255,255,255,0.98);
    border-radius: 22px;
    padding: 42px 36px;
    max-width: 420px; width: 100%;
    box-shadow: 0 30px 60px rgba(14,23,18,0.4);
  }
  .back-link { display: inline-block; margin-bottom: 18px; font-size: 13px; color: #6B7A70; }
  .glass-icon {
    width: 64px; height: 64px; border-radius: 18px;
    background: linear-gradient(150deg, #2E8B57, #1F6E43);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; margin: 0 auto 16px; color: #fff;
    box-shadow: 0 10px 22px rgba(31,110,67,0.35);
  }
  .glass-card h2 { font-family: 'Fraunces', Georgia, serif; text-align: center; font-size: 22px; font-weight: 700; color: #172420; margin-bottom: 4px; }
  .glass-card .sub { text-align: center; color: #6B7A70; font-size: 13px; margin-bottom: 26px; }
  .glass-field { margin-bottom: 16px; }
  .glass-field label { display: block; font-size: 12.5px; font-weight: 700; color: #445048; margin-bottom: 6px; }
  .glass-field input, .glass-field select {
    width: 100%; padding: 11px 14px; border-radius: 11px; border: 1.5px solid #DFE4D6;
    font-size: 14px; outline: none; transition: border 0.2s; font-family: 'Inter', sans-serif;
  }
  .glass-field input:focus, .glass-field select:focus { border-color: #1F6E43; }
  .glass-btn {
    width: 100%; padding: 12px; border-radius: 11px; border: none;
    background: linear-gradient(150deg, #2E8B57, #17502F);
    color: #fff; font-weight: 700; font-size: 14.5px; margin-top: 6px;
    box-shadow: 0 10px 22px rgba(31,110,67,0.3);
  }
  .glass-hint { text-align: center; font-size: 11.5px; color: #93A28F; margin-top: 18px; line-height: 1.6; }
  .glass-error { text-align: center; font-size: 12.5px; color: #A8402A; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
  <div class="auth-bg">
    <div class="glass-card">
      <a href="/login.html" class="back-link">← Back to portal selection</a>
      <div class="glass-icon">🧑‍🎓</div>
      <h2>Student Login</h2>
      <p class="sub">View your attendance, timetable &amp; notices</p>

      <div class="glass-field">
        <label>Register Number</label>
        <input id="username" placeholder="e.g. 22BCA001">
      </div>
      <div class="glass-field">
        <label>Department</label>
        <select id="department">
          <option value="BCA">BCA</option>
          <option value="CS">CS</option>
          <option value="IT">IT</option>
        </select>
      </div>
      <div class="glass-field">
        <label>Date of Birth</label>
        <input id="dob" type="date">
      </div>
      <button class="glass-btn" onclick="doLogin()">Login</button>
      <div class="glass-error" id="err"></div>
      <p class="glass-hint">Use your Register Number, Department, and Date of Birth as saved by your Admin.</p>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const department = document.getElementById('department').value;
      const dob = document.getElementById('dob').value;
      const err = document.getElementById('err');
      err.textContent = '';
      if (!username || !dob) { err.textContent = 'Please fill in your Register Number and Date of Birth.'; return; }
      try {
        const result = await apiPost('/login', { username, department, dob });
        if (!result.success) {
          err.textContent = result.message || 'Invalid Register Number';
          return;
        }
        if (result.role !== 'student') {
          err.textContent = 'This looks like a staff/admin account — use the Staff & Admin portal.';
          return;
        }
        sessionStorage.setItem('session', JSON.stringify(result));
        window.location.href = '/student-dashboard.html';
      } catch (e) {
        err.textContent = 'Server error. Is the server running?';
      }
    }
  </script>
</body>
</html>
