<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Timetable</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="/js/common.js"></script>
  <script>
    const session = requireAnyRole(['admin', 'staff']);
    const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const PERIODS = [1, 2, 3, 4, 5];
    let allStudents = [];
    const isStaff = session && session.role === 'staff';

    async function init() {
      if (!session) return;
      renderShell({ role: session.role, activeHref: '/staff-timetable.html', title: 'Manage Timetable', welcomeName: session.role === 'admin' ? 'Admin' : session.data.name });
      allStudents = await apiGet('/students');
      const isHOD = isStaff && session.data.role === 'HOD';
      const assignments = isStaff ? (session.data.assignments || []) : [];
      const depts = isHOD || !isStaff ? ALL_DEPARTMENTS.slice() : [...new Set(assignments.map(a => a.department))];
      window._assignments = assignments;
      window._isLocked = isStaff && !isHOD;
      document.getElementById('page-content').innerHTML = `
        <div class="card">
          <div class="form-row">
            <div class="field"><label>Department</label>
              <select id="dept" onchange="onDeptChange()">${depts.map(d => `<option value="${d}">${d}</option>`).join('')}</select>
            </div>
            <div class="field"><label>Year</label>
              <select id="year" onchange="loadTimetable()"></select>
            </div>
          </div>
          <div id="tt-wrap" style="margin-top:10px;"></div>
        </div>
      `;
      populateYears();
      loadTimetable();
    }

    function populateYears() {
      const dept = document.getElementById('dept').value;
      const yearSel = document.getElementById('year');
      if (window._isLocked) {
        const years = window._assignments.filter(a => a.department === dept).map(a => a.year);
        yearSel.innerHTML = years.map(y => `<option value="${y}">Year ${y}</option>`).join('');
      } else {
        yearSel.innerHTML = ALL_YEARS.map(y => `<option value="${y}">Year ${y}</option>`).join('');
      }
    }

    function onDeptChange() {
      populateYears();
      loadTimetable();
    }

    async function loadTimetable() {
      const dept = document.getElementById('dept').value;
      const year = document.getElementById('year').value;
      const timetable = await apiGet(`/timetable?department=${encodeURIComponent(dept)}&year=${encodeURIComponent(year)}`);
      window._tt = {};
      DAYS.forEach(day => {
        const existing = timetable.find(d => d.day === day);
        const slots = existing ? existing.slots.slice() : [];
        while (slots.length < PERIODS.length) slots.push({ time: '', subject: '', staff: isStaff ? session.data.name : '' });
        window._tt[day] = slots.slice(0, PERIODS.length);
      });
      renderGrid();
    }

    function renderGrid() {
      document.getElementById('tt-wrap').innerHTML = `
        <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Day</th>${PERIODS.map(p => `<th>Period ${p}</th>`).join('')}</tr></thead>
          <tbody>
            ${DAYS.map(day => `
              <tr>
                <td style="font-weight:700;color:#6366f1;white-space:nowrap;">${day}</td>
                ${PERIODS.map((p, i) => {
                  const s = window._tt[day][i];
                  return `<td style="min-width:150px;">
                    <input value="${s.subject}" placeholder="Subject" onchange="updateSlot('${day}',${i},'subject',this.value)" style="margin-bottom:4px;font-size:12.5px;">
                    <input value="${s.staff}" placeholder="Staff name" onchange="updateSlot('${day}',${i},'staff',this.value)" style="font-size:11.5px;padding:6px 8px;">
                  </td>`;
                }).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
        </div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="saveTimetable()">Save Timetable</button>
        <span id="tt-msg" style="margin-left:10px;font-size:12.5px;color:#16a34a;"></span>
      `;
    }

    function updateSlot(day, idx, field, value) {
      window._tt[day][idx][field] = value;
    }

    async function saveTimetable() {
      const dept = document.getElementById('dept').value;
      const year = document.getElementById('year').value;
      for (const day of DAYS) {
        await apiPost('/timetable', { department: dept, year, day, slots: window._tt[day] });
      }
      document.getElementById('tt-msg').textContent = '✅ Timetable saved for all days!';
      setTimeout(() => (document.getElementById('tt-msg').textContent = ''), 3000);
    }

    if (session) init();
  </script>
</body>
</html>
