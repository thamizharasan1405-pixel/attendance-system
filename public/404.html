<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found - Cloud Attendance System</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="public/css/style.css">

  <!-- Page-specific CSS -->
  <link rel="stylesheet" href="public/css/404.css">
<link rel="stylesheet" href="/css/redesign.css">
</head>

<body>

  <main class="err-shell">

    <section class="err-card" aria-labelledby="error-title">

      <div class="err-visual">

        <div class="err-glow"></div>

        <div class="err-badge" aria-hidden="true">
          <span>404</span>
        </div>

      </div>

      <div class="err-code">404</div>

      <h1 id="error-title" class="err-title">
        Page Not Found
      </h1>

      <p class="err-sub">
        The page you're looking for doesn't exist or may have been moved.
        Let's get you back to your attendance portal.
      </p>

      <a href="/login.html" class="err-btn">
        <span class="err-btn-icon">←</span>
        <span>Back to Login</span>
      </a>

      <div class="err-footer">
        <span class="err-dot"></span>
        Cloud Attendance System
      </div>

    </section>

  </main>

</body>
</html>
