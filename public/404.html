<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found - Cloud Attendance System</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .err-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 24px; }
  .err-card { text-align: center; max-width: 420px; }
  .err-badge {
    width: 84px; height: 84px; border-radius: 24px; margin: 0 auto 22px;
    background: var(--indigo-light); color: var(--indigo); font-size: 38px;
    display: flex; align-items: center; justify-content: center;
  }
  .err-code { font-family: 'Fraunces', Georgia, serif; font-size: 64px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
  .err-title { font-size: 17px; font-weight: 700; margin: 8px 0 6px; }
  .err-sub { font-size: 13.5px; color: var(--gray); margin-bottom: 26px; }
</style>
</head>
<body>
  <div class="err-shell">
    <div class="err-card">
      <div class="err-badge">🔍</div>
      <div class="err-code">404</div>
      <div class="err-title">Page Not Found</div>
      <p class="err-sub">The page you're looking for doesn't exist or may have been moved.</p>
      <a href="/login.html" class="btn btn-primary">← Back to Login</a>
    </div>
  </div>
</body>
</html>
