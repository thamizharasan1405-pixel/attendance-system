<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Directory</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/redesign.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="/js/common.js"></script>
  <script>
    const session = requireRole('admin');
    async function init() {
      if (!session) return;
      renderShell({ role: 'admin', activeHref: '/staff-directory.html', title: 'Staff Directory', welcomeName: 'Admin' });
      const staff = await apiGet('/staff');
      document.getElementById('page-content').innerHTML = `
        <div class="grid-3" style="gap:16px;">
          ${staff.map(s => `
            <div class="card">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
                ${s.photo ? `<img src="${s.photo}" class="profile-photo-preview" style="width:52px;height:52px;margin:0;">` : `<div class="avatar-lg">${s.name.charAt(0)}</div>`}
                <div>
                  <strong>${titleCase(s.name)}</strong>
                  <div style="font-size:12px;color:#94a3b8;">${s.role}${s.subject ? ' · ' + s.subject : ''}</div>
                </div>
              </div>
              <p style="font-size:12.5px;margin-bottom:4px;"><strong>Staff ID:</strong> ${s.staffId}</p>
              <p style="font-size:12.5px;margin-bottom:4px;"><strong>Assigned To:</strong> ${s.role === 'HOD' ? 'All departments · All years' : (s.assignments || []).map(a => a.department + '-Y' + a.year).join(', ') || '-'}</p>
              <p style="font-size:12.5px;margin-bottom:4px;"><strong>Phone:</strong> ${s.phone || '-'}</p>
              <p style="font-size:12.5px;margin-bottom:4px;"><strong>Email:</strong> ${s.email || '-'}</p>
              <p style="font-size:12.5px;margin-bottom:4px;"><strong>Last Login:</strong> ${formatLastLogin(s.lastLogin)}</p>
              <span class="badge ${(s.status || 'Active').toLowerCase()}">${s.status || 'Active'}</span>
              ${s.bio ? `<p style="font-size:12px;color:#64748b;margin-top:8px;">${s.bio}</p>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    function formatLastLogin(iso) {
      if (!iso) return 'Never logged in';
      const d = new Date(iso);
      return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) + ' at ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    if (session) init();
  </script>
</body>
</html>
