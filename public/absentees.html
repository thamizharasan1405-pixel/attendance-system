<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Lists</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="/js/common.js"></script>
  <script>
    const session = requireAnyRole(['admin', 'staff']);
    const isStaff = session && session.role === 'staff';
    const today = new Date().toISOString().slice(0, 10);
    function weekAgo() {
      const d = new Date(); d.setDate(d.getDate() - 6);
      return d.toISOString().slice(0, 10);
    }
    let allStudents = [];
    let currentList = [];

    async function init() {
      if (!session) return;
      renderShell({ role: session.role, activeHref: '/absentees.html', title: 'Daily Attendance Lists', welcomeName: session.role === 'admin' ? 'Admin' : session.data.name });
      allStudents = await apiGet('/students');
      const isHOD = isStaff && session.data.role === 'HOD';
      const assignments = isStaff ? (session.data.assignments || []) : [];
      const depts = isHOD || !isStaff ? ALL_DEPARTMENTS.slice() : [...new Set(assignments.map(a => a.department))];
      const isLocked = isStaff && !isHOD;
      window._assignments = assignments;
      window._isLocked = isLocked;

      document.getElementById('page-content').innerHTML = `
        <div class="card">
          <div class="form-row" style="grid-template-columns:1fr 1fr 1fr 1fr 1fr;">
            <div class="field"><label>Department</label>
              <select id="dept" onchange="onDeptChange()">${depts.map(d => `<option value="${d}">${d}</option>`).join('')}</select>
            </div>
            <div class="field"><label>Year</label>
              <select id="year" onchange="load()"></select>
            </div>
            <div class="field"><label>Status</label>
              <select id="status" onchange="load()">
                <option value="Absent">Absent</option>
                <option value="Present">Present</option>
                <option value="All">All (Present + Absent)</option>
              </select>
            </div>
            <div class="field"><label>View</label>
              <select id="view" onchange="onViewChange()">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly (last 7 days)</option>
                <option value="monthly">Monthly</option>
              </select>
            </div>
            <div class="field" id="range-input-field"><label>Date</label><input type="date" id="date" value="${today}" onchange="load()"></div>
          </div>
          <div class="toolbar" style="margin-top:6px;">
            <span id="result-count" style="font-size:12.5px;color:var(--gray);font-weight:600;"></span>
            <button class="btn btn-outline" onclick="downloadExcel()">⬇ Download Excel</button>
          </div>
          <div id="wrap"></div>
        </div>
      `;
      populateYears();
      load();
    }

    function populateYears() {
      const dept = document.getElementById('dept').value;
      const yearSel = document.getElementById('year');
      if (window._isLocked) {
        const years = window._assignments.filter(a => a.department === dept).map(a => a.year);
        yearSel.innerHTML = `<option value="">All my years</option>` + years.map(y => `<option value="${y}">Year ${y}</option>`).join('');
      } else {
        yearSel.innerHTML = `<option value="">All Years</option>` + ALL_YEARS.map(y => `<option value="${y}">Year ${y}</option>`).join('');
      }
    }

    function onDeptChange() { populateYears(); load(); }

    function onViewChange() {
      const view = document.getElementById('view').value;
      const field = document.getElementById('range-input-field');
      if (view === 'daily') {
        field.innerHTML = `<label>Date</label><input type="date" id="date" value="${today}" onchange="load()">`;
      } else if (view === 'monthly') {
        field.innerHTML = `<label>Month</label><input type="month" id="month" value="${today.slice(0,7)}" onchange="load()">`;
      } else {
        field.innerHTML = `<label>Range</label><div style="padding:10px 0;font-size:12px;color:var(--gray-light);">Last 7 days up to today</div>`;
      }
      load();
    }

    async function load() {
      const dept = document.getElementById('dept').value;
      const year = document.getElementById('year').value;
      const status = document.getElementById('status').value;
      const view = document.getElementById('view').value;
      let url = `/attendance/absentees?department=${encodeURIComponent(dept)}&status=${encodeURIComponent(status)}`;
      if (year) url += `&year=${encodeURIComponent(year)}`;
      if (view === 'daily') {
        const dateEl = document.getElementById('date');
        if (dateEl) url += `&date=${dateEl.value}`;
      } else if (view === 'monthly') {
        const monthEl = document.getElementById('month');
        if (monthEl) url += `&month=${monthEl.value}`;
      } else {
        url += `&from=${weekAgo()}&to=${today}`;
      }
      const list = await apiGet(url);
      currentList = list; // already sorted alphabetically by name from the server
      document.getElementById('result-count').textContent = `${list.length} record${list.length === 1 ? '' : 's'}`;
      document.getElementById('wrap').innerHTML = `
        <table style="margin-top:10px;">
          <thead><tr><th>Name</th><th>Reg No</th><th>Department</th><th>Year</th><th>Date</th><th>Period</th><th>Status</th></tr></thead>
          <tbody>
            ${list.map(a => `
              <tr>
                <td style="font-weight:700;">${titleCase(a.name)}</td>
                <td>${a.regNo}</td>
                <td>${a.department}</td>
                <td>${a.year}</td>
                <td>${a.date}</td>
                <td>${a.period ? 'Period ' + a.period : '-'}</td>
                <td><span class="badge ${a.status.toLowerCase()}">${a.status}</span></td>
              </tr>`).join('') || `<tr><td colspan="7"><div class="empty-state"><div class="icon">📋</div><div class="title">No records found</div><div class="sub">Try a different date, department or status</div></div></td></tr>`}
          </tbody>
        </table>
      `;
    }

    function downloadExcel() {
      if (!currentList.length) { alert('No records to export for this selection.'); return; }
      const rows = currentList.map(a => ({
        Name: titleCase(a.name),
        'Reg No': a.regNo,
        Department: a.department,
        Year: a.year,
        Date: a.date,
        Period: a.period ? 'Period ' + a.period : '-',
        Status: a.status
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = [{ wch: 20 }, { wch: 12 }, { wch: 12 }, { wch: 8 }, { wch: 12 }, { wch: 10 }, { wch: 10 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
      const view = document.getElementById('view').value;
      const dept = document.getElementById('dept').value;
      XLSX.writeFile(wb, `Attendance_${dept}_${view}_${today}.xlsx`);
    }

    if (session) init();
  </script>
</body>
</html>
