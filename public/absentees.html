<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absentee Lists</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="/js/common.js"></script>
  <script>
    const session = requireAnyRole(['admin', 'staff']);
    const isStaff = session && session.role === 'staff';
    const staffDept = isStaff ? session.data.department : null;
    const today = new Date().toISOString().slice(0, 10);
    function weekAgo() {
      const d = new Date(); d.setDate(d.getDate() - 6);
      return d.toISOString().slice(0, 10);
    }
    let allStudents = [];

    async function init() {
      if (!session) return;
      renderShell({ role: session.role, activeHref: '/absentees.html', title: 'Absentee Lists', welcomeName: session.role === 'admin' ? 'Admin' : session.data.name });
      allStudents = await apiGet('/students');
      let depts = [...new Set(allStudents.map(s => s.department))];
      if (isStaff) depts = depts.filter(d => d === staffDept);
      document.getElementById('page-content').innerHTML = `
        <div class="card">
          <div class="form-row" style="grid-template-columns:1fr 1fr 1fr 1fr;">
            <div class="field"><label>Department</label>
              <select id="dept" ${isStaff ? 'disabled' : ''} onchange="load()">${depts.map(d => `<option value="${d}">${d}</option>`).join('')}</select>
            </div>
            <div class="field"><label>View</label>
              <select id="view" onchange="load()">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly (last 7 days)</option>
              </select>
            </div>
            <div class="field" id="date-field"><label>Date</label><input type="date" id="date" value="${today}" onchange="load()"></div>
            <div class="field"></div>
          </div>
          <div id="wrap"></div>
        </div>
      `;
      load();
    }

    async function load() {
      const dept = document.getElementById('dept').value;
      const view = document.getElementById('view').value;
      document.getElementById('date-field').style.display = view === 'daily' ? '' : 'none';
      let url = `/attendance/absentees?department=${encodeURIComponent(dept)}`;
      if (view === 'daily') url += `&date=${document.getElementById('date').value}`;
      else url += `&from=${weekAgo()}&to=${today}`;
      const list = await apiGet(url);
      document.getElementById('wrap').innerHTML = `
        <table style="margin-top:14px;">
          <thead><tr><th>Date</th><th>Name</th><th>Reg No</th><th>Year</th><th>Period</th></tr></thead>
          <tbody>
            ${list.map(a => `
              <tr>
                <td>${a.date}</td><td>${a.name}</td><td>${a.regNo}</td><td>${a.year}</td>
                <td>${a.period ? 'Period ' + a.period : '-'}</td>
              </tr>`).join('') || `<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px;">🎉 No absentees</td></tr>`}
          </tbody>
        </table>
      `;
    }

    if (session) init();
  </script>
</body>
</html>
